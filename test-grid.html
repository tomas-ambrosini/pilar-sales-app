<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen w-screen flex flex-col">
  <div class="h-16 bg-blue-500">Header</div>
  <div class="flex-1 flex flex-col min-h-0 bg-red-500">
    <div class="flex-1 overflow-auto bg-green-500 flex flex-col">
      <div class="min-w-max flex-1 grid" style="grid-template-columns: 200px repeat(3, minmax(100px, 1fr)); grid-template-rows: 48px repeat(5, minmax(75px, 1fr));">
         <div class="bg-purple-200">Header 0</div><div class="bg-purple-300">1</div><div class="bg-purple-300">2</div><div class="bg-purple-300">3</div>
         <div class="bg-yellow-200">Row 1</div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
         <div class="bg-yellow-200">Row 2</div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
         <div class="bg-yellow-200">Row 3</div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
         <div class="bg-yellow-200">Row 4</div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
         <div class="bg-yellow-200">Row 5</div><div class="bg-white"></div><div class="bg-white"></div><div class="bg-white"></div>
      </div>
    </div>
  </div>
  <div class="h-64 bg-gray-500">Bottom Tray</div>
</body>
</html>
