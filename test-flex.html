<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-gray-200 flex flex-col p-10">
    <!-- Header -->
    <div class="h-20 bg-blue-500 shrink-0">Header</div>
    
    <!-- Modal Body -->
    <div class="flex-1 min-h-0 bg-white flex flex-col border border-red-500 max-h-[500px]">
        <!-- Stepper -->
        <div class="h-16 bg-green-500 shrink-0">Stepper</div>
        
        <!-- Flex Row Parent -->
        <div class="flex flex-row flex-1 overflow-hidden min-h-0 border-4 border-purple-500">
            <!-- Left Panel (LACKS min-h-0) -->
            <div class="w-1/2 bg-yellow-100 overflow-y-auto flex flex-col min-w-0">
                <div class="h-[1000px] bg-yellow-300">Very tall content (1000px)</div>
            </div>
            
            <!-- Right Panel (LACKS min-h-0) -->
            <div class="w-1/2 bg-pink-100 flex flex-col relative min-w-0 h-full">
                <div class="h-16 bg-pink-300 shrink-0">Timeline Header</div>
                <div class="flex-1 min-h-0 overflow-y-auto bg-pink-400">
                    <div class="h-[800px]">Timeline bubbles (800px)</div>
                </div>
                <div class="h-20 bg-black text-white shrink-0 flex items-center justify-center text-xl font-bold">INPUT BOX</div>
            </div>
        </div>
        
        <!-- Action Footer -->
        <div class="h-16 bg-green-500 shrink-0">Action Footer</div>
    </div>
</body>
</html>
